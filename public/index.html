<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ごみの日</title>
  <meta name="theme-color" content="#2f7d4f">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    :root {
      --bg: #f6f7f4; --card: #fff; --text: #1d2420; --muted: #67706a;
      --accent: #2f7d4f; --accent-soft: #e3f1e8; --border: #e2e5e0;
      --burn: #d9534f; --res: #2b7bb9; --other: #8a6d3b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121513; --card: #1b201d; --text: #e7ece8; --muted: #9aa49d;
        --accent: #5cc187; --accent-soft: #1f3528; --border: #2a312c;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
      line-height: 1.5;
    }
    main { max-width: 520px; margin: 0 auto; padding: 20px 16px 48px; }
    header h1 { font-size: 1.4rem; margin: 0; }
    header p { margin: 2px 0 0; color: var(--muted); font-size: .9rem; }
    .hero {
      margin: 20px 0; padding: 20px; border-radius: 16px;
      background: var(--accent); color: #fff;
    }
    .hero small { opacity: .85; }
    .hero .kinds { font-size: 1.35rem; font-weight: 700; margin-top: 4px; }
    ul.days { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
    ul.days li {
      display: flex; gap: 12px; align-items: baseline; padding: 12px 14px;
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    }
    .hero.off { background: var(--card); color: var(--muted); border: 1px solid var(--border); }
    .next {
      margin: 0 0 24px; padding: 16px 18px; border-radius: 14px;
      background: var(--card); border: 2px solid var(--res);
    }
    .next small { color: var(--muted); }
    .next .when { font-size: 1.2rem; font-weight: 700; margin: 2px 0 8px; }
    ul.days li.special { border-color: var(--res); border-width: 2px; }
    .date { min-width: 5.5em; font-variant-numeric: tabular-nums; font-weight: 600; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag { font-size: .85rem; padding: 2px 8px; border-radius: 999px; color: #fff; background: var(--other); }
    .tag.burn { background: var(--burn); }
    .tag.res { background: var(--res); }
    section { margin-top: 28px; }
    h2 { font-size: 1rem; margin: 0 0 8px; }
    button {
      font: inherit; border: 0; border-radius: 10px; padding: 10px 16px;
      background: var(--accent); color: #fff; cursor: pointer;
    }
    button.secondary { background: var(--accent-soft); color: var(--accent); }
    textarea {
      width: 100%; min-height: 120px; margin-top: 8px; font: 12px/1.4 ui-monospace, monospace;
      background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 8px;
    }
    select { font: inherit; width: 100%; padding: 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text); }
    .muted { color: var(--muted); font-size: .85rem; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<main>
  <header>
    <h1>🗑️ ごみの日</h1>
    <p id="district">読み込み中…</p>
  </header>

  <div class="hero" id="hero" hidden>
    <small id="heroLabel">明日</small>
    <div class="kinds" id="heroKinds"></div>
  </div>

  <div class="next" id="next" hidden>
    <small>次の資源物・燃やせないごみ等</small>
    <div class="when" id="nextWhen"></div>
    <div id="nextKinds"></div>
  </div>

  <h2>この先の収集日</h2>
  <ul class="days" id="days"></ul>
  <p class="muted" id="fetched"></p>

  <section>
    <h2>通知</h2>
    <p class="muted">前日の夜 20 時ごろに通知します。資源物や燃やせないごみの日は 1 週間前にも予告します。iPhone は「ホーム画面に追加」してから開いてください。</p>
    <button id="subscribe">通知を有効にする</button>
    <div id="subBox" hidden>
      <p class="muted">下の内容を GitHub の Secret <code>PUSH_SUBSCRIPTIONS</code> に登録してください (家族の分は配列 <code>[...]</code> にまとめます)。</p>
      <textarea id="subJson" readonly></textarea>
      <button class="secondary" id="copy">コピー</button>
    </div>
    <p class="muted" id="subStatus"></p>
  </section>

  <section>
    <h2>地区コードを調べる</h2>
    <select id="districtSelect"><option value="">地区を選択…</option></select>
    <p class="muted" id="codeOut">選んだ地区のコードを GitHub の Variable <code>DISTRICT_CODE</code> に設定します。</p>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
